# App spec: what this app is. Schema and checker come from the template
# (utils/app_spec.schema.json, `python -m utils.app_spec`); the weekly
# template-sync job reads `template:` and `sync.app_owned` from here.
# App-owned: template syncs never overwrite this file.
spec_version: 1
template:
  repository: OpenMS/streamlit-template
  branch: main
app:
  slug: flashapp
  name: FLASHApp
  description: 'Top-down proteomics: FLASHDeconv deconvolution, FLASHTnT tag-based identification and
    label-free or TMT/iTRAQ quantification, with a configurable linked viewer.'
  repository: OpenMS/FLASHApp
  domain: top-down-proteomics
  image: ghcr.io/openms/flashapp
inputs:
  mzML-files:
    types:
    - mzML
    - raw
    - d
    multiple: true
    description: Top-down LC-MS runs; .raw and .d are converted.
  fasta-file:
    types:
    - fasta
    - peff
    multiple: false
    description: Protein database for FLASHTnT.
  ms1-files:
    types:
    - mzML
    - raw
    - d
    multiple: true
    description: MS1 acquisitions for FAIMS-aware inclusion-list planning.
workflows:
- name: FLASHTnT
  class: src/Workflow.py:TopDownWorkflow
  inputs:
  - mzML-files
  - fasta-file
  steps:
  - tool: DecoyDatabase
    in: fasta-file
    optional: true
  - tool: FLASHDeconv
    in: mzML-files
  - tool: FLASHTnT
    in: FLASHDeconv
    optional: true
  - tool: FLASHAnnotator
    optional: true
  - tool: FLASHQuantConsensus
    optional: true
- name: MS1 inclusion planning
  class: src/MS1InclusionWorkflow.py:MS1InclusionWorkflow
  inputs:
  - ms1-files
  multi_run: true
  presets: true
  steps:
  - external: tdp_flashdeconv.cli
    in: ms1-files
    note: Profile mzML conversion, FAIMS CV separation, per-CV centroiding and FLASHDeconv
  - external: tdp_feature_alignment.cli
    in: tdp_flashdeconv.cli
    note: OpenMS RT alignment and modified native FLASHQuant partial consensus per CV
  - external: tdp_differential_abundance.cli
    in: tdp_feature_alignment.cli
    note: Per-CV replicate-complete Welch t-tests with BH correction
  - external: tdp_inclusion_list.cli
    in: tdp_differential_abundance.cli
    note: CV-aware quality, differential and condition-specific precursor targets
results:
- role: custom
  workflow: MS1 inclusion planning
  title: MS1 input and configuration validation report
  page: content/MS1Inclusion/MS1InclusionResults.py
- role: custom
  workflow: FLASHTnT
  title: Viewer (Vue grid)
  page: content/TopDown/TopDownViewer.py
pages:
- content/quickstart.py
- content/user_guide.py
- content/TopDown/TopDownConfigure.py
- content/TopDown/TopDownRun.py
- content/TopDown/TopDownViewer.py
- content/TopDown/TopDownDownload.py
- content/MS1Inclusion/MS1InclusionUpload.py
- content/MS1Inclusion/MS1InclusionConfigure.py
- content/MS1Inclusion/MS1InclusionRun.py
- content/MS1Inclusion/MS1InclusionResults.py
deploy:
  k8s:
    enabled: true
    hosts:
    - flashapp.webapps.openms.de
    - flashapp.webapps.openms.org
    worker_tier: high
  docker_compose: true
  desktop:
  - windows
  online_deployment: false

# Optional CI checks, all on by default. An app with few CI minutes turns off
# what it does not need (and sets deploy.desktop: [] to skip desktop builds).
# ci:
#   kind_tests: false             # kind deployments behind nginx and Traefik
#   apptainer: false              # Apptainer test and SIF
#   example_workflow_tests: false # workflow-tests.yml (template example)
#   openms_release: false         # PRs for new OpenMS releases

sync:
  app_owned:
  - app.yaml
  - app.py
  - settings.json
  - default-parameters.json
  - presets.json
  - parameter-names.json
  - contributors.json
  - README.md
  - content/*
  - src/python-tools/*
  - example-data/*
  - assets/*
  - k8s/overlays/*
  - .github/workflows/build-and-test.yml
  - .github/kind-config.yaml
  - CLAUDE.app.md
  - src/Workflow.py
  - src/MS1InclusionWorkflow.py
  - src/ms1_inclusion_validation.py
  - src/ms1_inclusion_pipeline.py
  - tests/test_ms1_inclusion_workflow.py
  - tests/test_ms1_inclusion_pipeline.py
  - docs/MS1_INCLUSION_WORKFLOW.md
  - js-component/*
  - .gitmodules
  - openms-streamlit-vue-component
  - src/parse/*
  - src/render/*
  - tests/test_tasks.py
  - tests/test_workspace_sync.py
  - tests/test_seed_demos.py
  - tests/test_run_manager.py
  - dependency-licenses.json
