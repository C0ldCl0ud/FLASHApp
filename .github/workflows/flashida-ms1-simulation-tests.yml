name: FLASHIda MS1 replay tests

on:
  push:
    branches:
      - feature/flashida-ms1-simulation
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest
      - name: Check Python syntax
        run: python -m compileall -q src/flashida_simulation.py src/flashida_experiment.py src/Workflow.py content/FLASHIda/FLASHIdaSimulation.py app.py
      # The private thesis repository is not accessible using this workflow's
      # GITHUB_TOKEN. An optional integration test runs on a local machine with
      # FLASHIDA_THESIS_SOURCE set to the already cloned thesis project.
      - name: Test simulation, explicit design and contrast orchestration
        run: python -m pytest -q tests/test_flashida_simulation.py tests/test_flashida_experiment.py
